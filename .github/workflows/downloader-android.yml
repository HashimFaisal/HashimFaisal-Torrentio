name: Torrentio Downloader Android

on:
  push:
    branches: [torrentio-downloader-android]
    paths:
      - "downloader-android/**"
      - ".github/workflows/downloader-android.yml"
  pull_request:
    paths:
      - "downloader-android/**"
      - ".github/workflows/downloader-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: downloader-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: torrentio-downloader-debug
          path: downloader-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
